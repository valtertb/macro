name: Update macro bias

# Weekdays, UTC. ~05:17 (before London), ~13:47 (after 08:30 ET US releases), ~21:17 (after US close).
# GitHub may start scheduled runs a few minutes late. "Run workflow" = manual refresh.
on:
  schedule:
    - cron: "17 5 * * 1-5"
    - cron: "47 13 * * 1-5"
    - cron: "17 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "public/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macro-bias
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        run: npm test
      - name: Check sources (diagnostics only)
        run: npm run check-sources || echo "::warning::Some data sources failed, see log above"
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Build site
        run: npm run build-site
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Save score history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then echo "History unchanged"; else
            git commit -m "Update score history [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
