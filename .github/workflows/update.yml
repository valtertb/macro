name: Update macro bias

# Weekdays. GitHub cron is UTC and ignores daylight saving, so each window is scheduled for both
# CEST (UTC+2, summer) and CET (UTC+1, winter) Bratislava time. GitHub may start runs 5-15 min late.
#  - before London open 09:00 Bratislava:  05:52 + 06:52 UTC  -> summer 07:52/08:52, winter 06:52/07:52
#  - ECB daily data around midday:         11:17 UTC
#  - US releases (08:30 ET = 14:30 Bratislava) through NY open 15:30: every 15 min 12:07-13:52 UTC
#      -> summer 14:07-15:52, winter 13:07-14:52 Bratislava
#  - after US close (FRED/Treasury end-of-day): 21:17 UTC
# "Run workflow" = manual refresh.
on:
  schedule:
    - cron: "52 5,6 * * 1-5"
    - cron: "17 11 * * 1-5"
    - cron: "7,22,37,52 12,13 * * 1-5"
    - cron: "17 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "public/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macro-bias
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        run: npm test
      - name: Check sources (diagnostics only)
        run: npm run check-sources || echo "::warning::Some data sources failed, see log above"
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Build site
        run: npm run build-site
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Save score history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then echo "History unchanged"; else
            git commit -m "Update score history [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
